# Sonic Adventure, MK-5100050
# Written by `dcdisc new-game`. Everything here is read off the disc or is the standard Katana
# layout; nothing from the disc itself is ever committed.

[game]
id = "sonicadv"
title = "Sonic Adventure"
region = "Europe"
product = "MK-5100050"

[disc]
image = "../../assets/Sonic Adventure v1.003 (1999)(Sega)(PAL)(M5)[!].gdi"

[binary]
path = "extracted/fs/1ST_READ.BIN"
load_address = 0x8C010000    # where the console's BIOS loads the file
link_address = 0x0C010000    # the same RAM through a different address; what the code assumes
entry = 0x8C010000           # the first instruction

# Addresses discovery does not reach, and regions the program copies and runs elsewhere, both go
# here. Run the launcher with --suggest-config FILE and it writes them for you.
[functions]
# Call targets the 2026-10-28 boot test reached that discovery had missed (count in brackets).
extra = [0x0C02DE20,  # 2
         0x0C02DE86,  # 2
         0x0C02DF20,  # 10
         0x0C02DF86,  # 1
         0x0C0C5C7E,  # 650
         0x0C05EF62,  # boot 3: 1
         0x0C07D53C,  # boot 3: 1
         0x0C090500,  # boot 3: 16
         0x0C019360,  # headless runs: entries after another function's rts, called through
         0x0C05EF76,  #   pointers (two of them from ADVERTISE's literal pool)
         0x0C07D528,
         0x0C0904B2,
         0x0C04F692,  # headless run 2: entries after rts/jmp, reached through pointers
         0x0C07EE82,  #   (0x0C07EE82 527 times)
         0x0C0A65D6,
         0x0C0A6770,
         0x0C0A67C0,
         0x0C107A36,
         0x0C6446D4,  # headless run 3: a getter called 147,793 times untranslated
         0x0C6446DA,
         0x0C65C148]

# Exception and interrupt stubs the startup code copies below the program (VBR = 0x8C000000).
# Each 0x34-byte stub saves r0 into its own literal pool before reading EXPEVT/INTEVT, so the
# copies must read every literal at run time (no_fold). 0x100 and 0x400 are copies of the same
# EXPEVT stub (found by the 2026-10-28 boot test); 0x600 is the INTEVT stub right after it, which
# the run reached 14,903 times through the interpreter because its patched word hid the match.
[[relocations]]
source = 0x0C65E6E4
size = 0x34
dest = 0x8C000100
no_fold = true

[[relocations]]
source = 0x0C65E6E4
size = 0x34
dest = 0x8C000400
no_fold = true

[[relocations]]
source = 0x0C65E718
size = 0x34
dest = 0x8C000600
no_fold = true

# Other run-time copies the 2026-10-28 boot test found (exact byte matches).
[[relocations]]
source = 0x0C14EF84
size = 0x30
dest = 0x8C00B39C

[[relocations]]
source = 0x0C67BF50
size = 0x44
dest = 0x8C00D824

[[relocations]]
source = 0x0C1BF008
size = 0x34
dest = 0x8C00EF74

[[relocations]]
source = 0x0C67C100
size = 0x48
dest = 0x8C00F3F8

# Area and stage code modules: PRS files the game decompresses to 0x8C900000 when you enter them
# (tools/prs_extract.py writes them to extracted/modules/). ADV00 = Station Square, confirmed on
# 2026-10-28: all 512 bytes dumped at 0x8C900000 equal ADV00.PRS decompressed. Only each module's
# code region is translated (Station Square: code ends near 0x13000, then model and level data).
# Overlay: every module shares 0x8C900000, and dispatch runs one only while RAM holds its bytes.
# (2_DP.BIN, tried first, was a false lead: it never appeared at 0x8C900000.)
[[relocations]]
file = "extracted/modules/ADV00.bin"
source = 0x0
size = 0x14000
dest = 0x8C900000
overlay = true
# Entry points boot 3 called that discovery had inside other functions (0x20 from 0x0C053C0A,
# 0xA6 from 0x0C053C16: a second entry three instructions into a prologue, 0x63E from 0x0C0986F6)
# or missed entirely (0x1440, 0xF620, 0x11F00).
entries = [0x8C900000, 0x8C900020, 0x8C900062, 0x8C9000A6, 0x8C90063E, 0x8C901440, 0x8C90F620,
           0x8C911F00]

# ADVERTISE.PRS: the title screen and menus module (dumps at 12 and 24 guest s: 0x8C900000 holds
# its header table 8C9000E8 8C9001A0 8C9001BA, matched against every module). Its untranslated
# entries were what kept the menus, and everything they called, in the interpreter (0x8C9001BA
# 830 times, 0x8C901568 827). Code region ends near 0xF000. Seeds: the header's three functions
# and the prologues the runs reached; offset 0 is the table, not code.
[[relocations]]
file = "extracted/modules/ADVERTISE.bin"
source = 0x0
size = 0x10000
dest = 0x8C900000
overlay = true
entries = [0x8C9000E8, 0x8C9001A0, 0x8C9001BA, 0x8C900020, 0x8C900040, 0x8C901440, 0x8C901568,
           0x8C901890, 0x8C90197A, 0x8C902698, 0x8C902786, 0x8C903000, 0x8C903086]

# MOVIE.BIN: the movie player (Sofdec), loaded to 0x8CEB0000 (its code at offset 0x3B0 found in a
# RAM dump at that address; RAM equals the file for its first 0x1B000 bytes at 34 guest s, the
# rest is reused afterwards). Untranslated, it ran the intro through the interpreter, and every
# resume of its task (0x8CEB03BA, 0x8CECFAA0 x169, ...: return points after jsr in this file)
# left the interpreter running at top level, through the game loop and the model drawing, where
# the bad reads came from. Whole file; overlay, so the check skips it once the area is reused.
[[relocations]]
file = "extracted/fs/SONICAD/MOVIE.BIN"
source = 0x0
size = 0x2D110
dest = 0x8CEB0000
overlay = true

