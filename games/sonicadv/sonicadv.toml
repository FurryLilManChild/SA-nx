# Cutscene code (2026-11-03, phase 2): the 207 EV*.PRS story event files that carry code. Each is
# PRS-compressed (tools/prs_extract.py --events writes them to extracted/events/) and loads at
# 0x8CB80000; word 0 of the file is its entry function. Untranslated until now, so every cutscene
# ran in the interpreter. The 29 EV_*.PRS files are texture archives (PVMH), not code.
# Many files share helper functions at the same offsets that start alike and differ further in
# (184 signature collisions with the default 32-word signatures, measured over all 207 files), so
# these units sign each function's whole extent and send every call through the dispatcher
# (full_signature, dispatch_calls), read literals from RAM (no_fold), and are one unit each
# (parts = 1). Size: the last dense code window plus one, or the header's second pointer if
# further, or the whole file when small.
[[relocations]]
file = "extracted/events/EV0001.bin"
source = 0x0
size = 0x6F8C
dest = 0x8CB80000
overlay = true
no_fold = true
parts = 1
full_signature = true
dispatch_calls = true
entries = [0x8CB80020]

