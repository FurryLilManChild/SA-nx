# MOVIE.BIN: the movie player (Sofdec), loaded to 0x8CEB0000 (its code at offset 0x3B0 found in a
# RAM dump at that address; RAM equals the file for its first 0x1B000 bytes at 34 guest s, the
# rest is reused afterwards). Untranslated, it ran the intro through the interpreter, and every
# resume of its task (0x8CEB03BA, 0x8CECFAA0 x169, ...: return points after jsr in this file)
# left the interpreter running at top level, through the game loop and the model drawing, where
# the bad reads came from. Whole file; overlay, so the check skips it once the area is reused.
[[relocations]]
file = "extracted_us/fs/SONICADV/MOVIE.BIN"
source = 0x0
size = 0x2D110
dest = 0x8CEB0000
overlay = true


